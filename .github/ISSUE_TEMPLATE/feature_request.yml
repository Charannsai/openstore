name: Feature Request
description: Suggest a new feature or improvement for OpenStore
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the information below so we can understand your request and prioritize it.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Describe it clearly.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: "I would like OpenStore to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: "I also considered..."

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      description: Which part of OpenStore does this relate to?
      options:
        - App Discovery & Browsing
        - Installation Engine
        - App Management (launch, stop, update)
        - AI Analysis (Groq integration)
        - Desktop App (Electron)
        - UI / Design
        - Backend (Supabase)
        - Developer Experience
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important — improves my workflow
        - Critical — blocking my usage
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Examples
      description: If applicable, add mockups, screenshots of similar features in other apps, or diagrams.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, links, or references.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a PR to implement this feature
          required: false
        - label: I have searched existing issues and this is not a duplicate
          required: true
